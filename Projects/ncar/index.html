<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nexa Trader Uganda | Verified Car Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..125,200..800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --selection-bg: #ffedd5;
        --selection-text: #ea580c;
      }
      ::selection {
        background: var(--selection-bg);
        color: var(--selection-text);
      }
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
        color: #1e293b;
        overflow-x: hidden;
        width: 100%;
        background-color: #fafaf9;
      }
      .font-heading {
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f8fafc;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border: 2px solid #f8fafc;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .editorial-heading {
        font-family: 'Bricolage Grotesque', sans-serif;
        letter-spacing: -0.05em;
        line-height: 0.9;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      /* Page Transitions */
      .page-enter {
        animation: pageFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes pageFadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Staggered animations for mobile menu links */
      .nav-stagger > * {
        opacity: 0;
        transform: translateY(10px);
        animation: menuStagger 0.4s ease forwards;
      }
      @keyframes menuStagger {
        to { opacity: 1; transform: translateY(0); }
      }
      .nav-stagger > *:nth-child(1) { animation-delay: 0.1s; }
      .nav-stagger > *:nth-child(2) { animation-delay: 0.15s; }
      .nav-stagger > *:nth-child(3) { animation-delay: 0.2s; }
      .nav-stagger > *:nth-child(4) { animation-delay: 0.25s; }
      .nav-stagger > *:nth-child(5) { animation-delay: 0.3s; }

      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        animation: marquee 35s linear infinite;
        white-space: nowrap;
      }
      .animate-marquee:hover {
        animation-play-state: paused;
      }

      /* Mobile touch feedback */
      .active-scale:active {
        transform: scale(0.96);
      }

      /* Hide scrollbar for clean horizontal lists */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{

    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0"
  }
}
</script>
</head>

    <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
